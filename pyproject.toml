[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budget-inventory-benders"
version = "0.1.0"
description = "Robust inventory reconfiguration research code"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]
optimization = ["gurobipy>=12"]
reporting = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
